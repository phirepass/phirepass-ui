# fly.toml app configuration file generated for phirepass-ui on 2026-01-18T17:46:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'phirepass-ui'
primary_region = 'ams'

[env]
    NODE_ENV = 'production'
    PORT = '8084'
    NEXT_PUBLIC_SERVER_HOST = 'localhost'
    NEXT_PUBLIC_SERVER_PORT = '8080'

[build]

[http_service]
  internal_port = 8084
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
