<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Offline · Phirepass</title>
        <style>
            :root {
                color-scheme: dark;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1rem;
                padding: 2rem;
                text-align: center;
                background: hsl(222 22% 5%);
                color: hsl(210 20% 92%);
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
            }
            h1 {
                margin: 0;
                font-size: 1.5rem;
            }
            p {
                margin: 0;
                max-width: 32ch;
                color: hsl(215 16% 60%);
                line-height: 1.6;
            }
            img {
                width: 72px;
                height: 72px;
            }
            button {
                margin-top: 0.5rem;
                padding: 0.75rem 1.5rem;
                border: 1px solid hsl(160 64% 38% / 0.5);
                border-radius: 0.75rem;
                background: hsl(160 64% 38% / 0.12);
                color: hsl(160 84% 70%);
                font: inherit;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <img src="/icon-192.png" alt="" />
        <h1>You're offline</h1>
        <p>
            Phirepass needs a connection to reach your nodes — the agent is dialling out, but this
            device can't get through right now.
        </p>
        <button onclick="location.reload()">Try again</button>
    </body>
</html>
